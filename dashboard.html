<script>

    function clickme() {
        let decreaser = setInterval(()=>{
            let num = Number(timestamp.value)
            num--
            timestamp.value = num 
            // console.log(generateRandomRGBColor())

            if (num===0) {
                alert('time-out')
                clearInterval(decreaser)
                timestamp.value=''
            }

        }, 2000)
            }

    }, 5000)

    function generateRandomColor(){
        let value = [1,2,3,4,5,6,7,8,9,0,'a','b','c','d','e','f']

        }

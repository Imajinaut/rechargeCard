<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="signup-container">
        <h2>Sign Up</h2>
        <form action="#" method="POST" onsubmit="userAuth(event)">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required >
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            <button type="submit" id="signup">Sign Up</button>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
</body>
</html>
<script>



let userName = document.getElementById('username')
let userEmail = document.getElementById('email')
let userPassword = document.getElementById('password')
let confirmedPassword = document.getElementById('confirm-password')

let userDetails = JSON.parse(localStorage.getItem('customers')) || []

function userAuth(event) {
    event.preventDefault()
    if (userName.value === '' && userEmail.value === '') {
        alert('Please enter a username and Email')
        
    } else if (userPassword.value !== confirmedPassword.value) {
        alert('Your passwords must be the same')
    }else {
        let userObj ={ 
            user:userName.value,
            userEmail: userEmail.value,
            userPassword: userPassword.value
    }
    userDetails.push(userObj)
        localStorage.setItem('customers', JSON.stringify(userDetails));
        alert('signup successful')
        window.location.href = 'login.html'
        signup.disabled = true
    }
}



</script>
